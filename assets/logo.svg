<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Park In">
  <defs>
    <linearGradient id="pi-bg" x1="10" y1="6" x2="110" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34E5A5"/>
      <stop offset="0.55" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>
    <radialGradient id="pi-shine" cx="0.25" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pi-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#16223B"/>
    </linearGradient>
  </defs>

  <!-- fondo squircle con degradado -->
  <rect x="4" y="4" width="112" height="112" rx="34" fill="url(#pi-bg)"/>
  <rect x="4" y="4" width="112" height="112" rx="34" fill="url(#pi-shine)"/>
  <rect x="5.5" y="5.5" width="109" height="109" rx="32.5" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="2"/>

  <!-- "P" de parking -->
  <path d="M42 90 V30 H66 a19 19 0 0 1 0 38 H42"
        fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- flecha "IN" entrando a la P -->
  <g transform="translate(88 86)">
    <circle r="19" fill="url(#pi-badge)" stroke="#fff" stroke-width="3.5"/>
    <path d="M-8 0 H7 M1 -7 L8 0 L1 7" fill="none" stroke="#34E5A5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>