<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ParkTrack 3.0</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            parkGreen: '#16A34A',
            parkOrange: '#F97316',
            parkBlue: '#2563EB',
            parkDark: '#1E293B'
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS (Mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- HTML5-QRCode (Cámara) -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-20">

  <!-- Header -->
  <header class="bg-parkGreen text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-xl font-bold tracking-wide">ParkTrack <span class="text-xs bg-white text-parkGreen px-2 py-0.5 rounded-full font-black">3.0</span></h1>
    <div id="user-balance" class="bg-green-700 px-3 py-1 rounded-lg text-sm font-semibold">
      Saldo: $150.00 MXN
    </div>
  </header>

  <!-- Contenido Principal Dinámico -->
  <main id="app-content" class="p-4 max-w-md mx-auto">
    
    <!-- Sección Inicio -->
    <section id="sec-inicio" class="space-y-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 text-center">
        <h2 class="text-lg font-bold text-parkDark">¿Dónde te estacionas hoy?</h2>
        <p class="text-xs text-slate-500 mb-4">Escanea el código QR de entrada o busca un lugar cercano.</p>
        <button onclick="switchTab('scanner')" class="w-full bg-parkOrange text-white py-3 rounded-xl font-bold text-lg shadow-md hover:bg-orange-600 transition">
          📷 Escanear QR
        </button>
      </div>

      <!-- Accesos Rápidos -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="switchTab('mapa')" class="bg-white p-4 rounded-xl border border-slate-200 text-left hover:border-parkBlue transition">
          <span class="text-2xl">🗺️</span>
          <h3 class="font-bold text-slate-700 mt-1">Ver Mapa</h3>
          <p class="text-xs text-slate-400">Monterrey y Apodaca</p>
        </button>
        <button onclick="switchTab('historial')" class="bg-white p-4 rounded-xl border border-slate-200 text-left hover:border-parkBlue transition">
          <span class="text-2xl">📋</span>
          <h3 class="font-bold text-slate-700 mt-1">Mis Boletos</h3>
          <p class="text-xs text-slate-400">Activos e historial</p>
        </button>
      </div>
    </section>

    <!-- Sección Mapa -->
    <section id="sec-mapa" class="hidden space-y-3">
      <h2 class="font-bold text-slate-700">Estacionamientos Cercanos</h2>
      <div id="mapa-container" class="w-full h-80 rounded-2xl shadow-inner border border-slate-300"></div>
    </section>

    <!-- Sección QR Scanner -->
    <section id="sec-scanner" class="hidden space-y-3">
      <h2 class="font-bold text-slate-700 text-center">Escanear Boleto / Parquímetro</h2>
      <div id="reader" class="w-full bg-black rounded-2xl overflow-hidden min-h-[250px]"></div>
      <div id="qr-result" class="bg-white p-4 rounded-xl border text-center text-sm hidden"></div>
    </section>

  </main>

  <!-- Navegación Inferior -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-3 z-50">
    <button onclick="switchTab('inicio')" class="flex flex-col items-center text-parkGreen font-semibold text-xs">
      <span>🏠</span> Inicio
    </button>
    <button onclick="switchTab('mapa')" class="flex flex-col items-center text-slate-400 font-semibold text-xs">
      <span>🗺️</span> Mapa
    </button>
    <button onclick="switchTab('scanner')" class="flex flex-col items-center text-slate-400 font-semibold text-xs">
      <span>📷</span> Escáner
    </button>
  </nav>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
  <script src="js/map.js"></script>
  <script src="js/scanner.js"></script>
</body>
</html>
